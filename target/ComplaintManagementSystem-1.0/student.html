<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Complaints | CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e0e6f1;
    --ink: #1f2937;
    --muted: #7a869a;
    --blue: #3a66e0;
    --blue-dark: #2d55cc;
    --green: #2fb36d;
    --shadow-dark: rgba(163, 177, 198, .6);
    --shadow-light: rgba(255, 255, 255, .85);
    --raised: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
    --raised-sm: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    --inset: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  .topbar { max-width: 1100px; margin: 0 auto; padding: 24px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); box-shadow: var(--raised-sm);
          display: grid; place-items: center; color: var(--blue); font-weight: 800; font-size: .9rem; }
  .pill-link { text-decoration: none; color: var(--blue); font-weight: 600; font-size: .9rem; padding: 10px 20px;
               border-radius: 999px; background: var(--bg); box-shadow: var(--raised-sm); }
  .pill-link:hover { box-shadow: var(--inset); }
  .pill-link:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(58,102,224,.45); outline-offset: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 56px; }
  h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--blue); display: block; }
  .lead { color: var(--muted); margin: 0 0 28px; max-width: 52ch; }
  .card { background: var(--bg); border-radius: 24px; box-shadow: var(--raised); padding: 28px; }
  .card h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .label, label { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  input, select, textarea { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); border: 0; border-radius: 16px;
                            padding: 14px 16px; background: var(--bg); box-shadow: var(--inset); }
  textarea { min-height: 120px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #9aa5b8; }
  .btn { width: 100%; margin-top: 24px; padding: 16px; font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 18px; cursor: pointer;
         background: linear-gradient(135deg, var(--blue), var(--blue-dark)); box-shadow: 6px 6px 16px rgba(58,102,224,.35), -4px -4px 12px var(--shadow-light); }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 10px; font-size: .93rem; }
  th { text-align: left; font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 14px 4px; }
  td { padding: 14px; background: var(--bg); box-shadow: var(--raised-sm); vertical-align: middle; }
  td:first-child { border-radius: 14px 0 0 14px; } td:last-child { border-radius: 0 14px 14px 0; }
  .id { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .chip { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; background: var(--bg); box-shadow: var(--inset); }
  .Pending { color: #b7791f; } .In-Progress { color: var(--blue); } .Resolved { color: var(--green); }
  .empty { text-align: center; color: var(--muted); padding: 32px 10px; background: transparent; box-shadow: none; }
  #toast { position: fixed; right: 24px; bottom: 24px; padding: 14px 22px; border-radius: 16px; background: var(--bg); color: var(--ink);
           box-shadow: var(--raised); font-size: .9rem; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .grid { display: grid; gap: 28px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1.7fr 1fr; align-items: start; } }
  :root[data-theme="dark"] {
    --bg: #1d2230;
    --ink: #e6eaf2;
    --muted: #8b95a9;
    --blue: #6b8ff7;
    --blue-dark: #4f74e6;
    --green: #3ccf84;
    --shadow-dark: rgba(0, 0, 0, .55);
    --shadow-light: rgba(255, 255, 255, .05);
  }
  :root[data-theme="dark"] input::placeholder, :root[data-theme="dark"] textarea::placeholder { color: #6c7690; }
  :root[data-theme="dark"] .Pending { color: #e8b04a; }
  .actions { display: flex; align-items: center; gap: 12px; }
  button.pill-link { border: 0; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
</style>
<script>try{var t=localStorage.getItem("cms-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">CMS</div><span>Complaint Management</span></div>
  <div class="actions">
    <button type="button" class="pill-link" id="themeToggle" aria-label="Switch between light and dark mode">Dark mode</button>
    <a class="pill-link" href="/api/logout">Log out</a>
  </div>
</div>
<div class="wrap">
  <h1>Your complaints,<em>tracked in one place.</em></h1>
  <p class="lead">Submit a new complaint and follow its status from Pending to Resolved.</p>
  <div class="grid">
    <section class="card" aria-labelledby="lh">
      <h2 id="lh">My complaints</h2>
      <p class="sub">Everything you have submitted so far.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th></tr></thead>
          <tbody id="complaintTableBody"></tbody>
        </table>
      </div>
    </section>
    <section class="card" aria-labelledby="fh">
      <h2 id="fh">New complaint</h2>
      <p class="sub">Tell us what went wrong and where.</p>
      <form id="complaintForm">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Wi-Fi not working in Lab 3" required>
        <label for="category">Category</label>
        <select id="category">
          <option value="IT Support">IT Support</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Academic">Academic</option>
        </select>
        <label for="description">Description</label>
        <textarea id="description" placeholder="What happened, and since when?" required></textarea>
        <button type="submit" class="btn" id="submitBtn">Submit complaint &rarr;</button>
      </form>
    </section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2800);
  }

  function loadComplaints() {
    // Added { cache: "no-store" } to force the browser to fetch live data from MySQL
    fetch("/api/get-complaints", { cache: "no-store" })
      .then(res => { if (res.status === 401) { window.location.href = "index.html"; return null; } return res.json(); })
      .then(data => {
        if (!data) return;
        const body = document.getElementById("complaintTableBody");
        if (data.length === 0) {
          body.innerHTML = '<tr><td colspan="4" class="empty">No complaints yet. Use the form to submit your first one.</td></tr>';
          return;
        }
        body.innerHTML = data.map(c => {
          // Checks for id, complaintId, or complaint_id depending on how your Java serialized it
          const compId = c.id || c.complaintId || c.complaint_id || 'N/A';
          return '<tr><td class="id">' + esc(compId) + '</td><td>' + esc(c.title) + '</td><td>' + esc(c.category) +
                 '</td><td><span class="chip ' + esc(String(c.status).replace(/\s+/g, "-")) + '">' + esc(c.status) + '</span></td></tr>';
        }).join("");
      })
      .catch(() => toast("Could not load complaints. Is the server running?"));
  }
  
  document.getElementById("complaintForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    const data = new URLSearchParams();
    data.append("title", document.getElementById("title").value.trim());
    data.append("category", document.getElementById("category").value);
    data.append("description", document.getElementById("description").value.trim());
    fetch("/api/complaint", { method: "POST", body: data })
      .then(res => res.json())
      .then(r => {
        if (r.success) { toast("Complaint submitted. Your ID is " + r.complaintId); this.reset(); loadComplaints(); }
        else toast(r.message || "Could not submit the complaint.");
      })
      .catch(() => toast("Could not submit the complaint. Is the server running?"))
      .finally(() => { btn.disabled = false; });
  });
  
  loadComplaints();

  (function () {
    const root = document.documentElement, btn = document.getElementById("themeToggle");
    function paint() { btn.textContent = root.getAttribute("data-theme") === "dark" ? "Light mode" : "Dark mode"; }
    btn.addEventListener("click", function () {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("cms-theme", next); } catch (e) {}
      paint();
    });
    paint();
  })();
</script>
</body>
</html>
