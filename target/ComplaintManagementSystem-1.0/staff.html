<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Dashboard | CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e0e6f1;
            --ink: #1f2937;
            --muted: #7a869a;
            --blue: #3a66e0;
            --blue-dark: #2d55cc;
            --green: #2fb36d;
            --yellow: #b7791f;
            --shadow-dark: rgba(163, 177, 198, .6);
            --shadow-light: rgba(255, 255, 255, .85);
            --raised: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
            --raised-sm: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
            --inset: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }

        .topbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 24px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--bg);
            box-shadow: var(--raised-sm);
            display: grid;
            place-items: center;
            color: var(--blue);
            font-weight: 800;
        }

        .pill-link {
            text-decoration: none;
            color: var(--blue);
            font-weight: 600;
            font-size: .9rem;
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--bg);
            box-shadow: var(--raised-sm);
            border: 0;
            cursor: pointer;
        }

        .pill-link:hover {
            box-shadow: var(--inset);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px 56px;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.5rem);
            margin: 0 0 10px;
        }

        h1 em {
            font-style: normal;
            color: var(--blue);
            display: block;
        }

        .lead {
            color: var(--muted);
            margin: 0 0 28px;
        }

        .card {
            background: var(--bg);
            border-radius: 24px;
            box-shadow: var(--raised);
            padding: 28px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin: 0 0 4px;
        }

        .card .sub {
            color: var(--muted);
            font-size: .9rem;
            margin: 0 0 20px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            font-size: .93rem;
        }

        th {
            text-align: left;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0 14px 4px;
        }

        td {
            padding: 14px;
            background: var(--bg);
            box-shadow: var(--raised-sm);
            vertical-align: middle;
        }

        td:first-child {
            border-radius: 14px 0 0 14px;
        }

        td:last-child {
            border-radius: 0 14px 14px 0;
        }

        .id {
            color: var(--muted);
            font-weight: 600;
        }

        .chip {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 700;
            background: var(--bg);
            box-shadow: var(--inset);
        }

        .Pending {
            color: var(--yellow);
        }

        .In-Progress {
            color: var(--blue);
        }

        .Resolved {
            color: var(--green);
        }

        select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 0;
            background: var(--bg);
            box-shadow: var(--inset);
            font: inherit;
            font-size: .88rem;
            color: var(--ink);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 32px;
            box-shadow: none;
        }

        #toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            padding: 14px 22px;
            border-radius: 16px;
            background: var(--bg);
            color: var(--ink);
            box-shadow: var(--raised);
            font-size: .9rem;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            z-index: 50;
        }

        #toast.show {
            opacity: 1;
            transform: none;
        }

        :root[data-theme="dark"] {
            --bg: #1d2230;
            --ink: #e6eaf2;
            --muted: #8b95a9;
            --blue: #6b8ff7;
            --green: #3ccf84;
            --yellow: #e8b04a;
            --shadow-dark: rgba(0, 0, 0, .55);
            --shadow-light: rgba(255, 255, 255, .05);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
    <script>try { var t = localStorage.getItem("cms-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) { }</script>
</head>

<body>
    <div class="topbar">
        <div class="brand">
            <div class="logo">CMS</div><span>Staff Portal</span>
        </div>
        <div class="actions">
            <button type="button" class="pill-link" id="themeToggle">Dark mode</button>
            <a class="pill-link" href="/api/logout">Log out</a>
        </div>
    </div>

    <div class="wrap">
        <h1>Assigned tasks,<em>your active queue.</em></h1>
        <p class="lead">Review complaints assigned to you and update their status.</p>

        <section class="card">
            <h2>Assigned complaints</h2>
            <p class="sub">Manage and resolve tickets.</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg; t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2800);
        }

        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function loadStaffComplaints() {
            fetch("/api/get-staff-complaints", { cache: "no-store" })
                .then(res => {
                    if (res.status === 401) { window.location.href = "index.html"; return null; }
                    return res.json();
                })
                .then(data => {
                    if (!data) return;
                    const body = document.getElementById("staffTableBody");
                    if (data.length === 0) {
                        body.innerHTML = '<tr><td colspan="6" class="empty">No complaints are currently assigned to you.</td></tr>';
                        return;
                    }

                    body.innerHTML = data.map(c => {
                        const compId = c.id || c.complaintId || c.complaint_id || 'N/A';
                        const statusOpts = ["Pending", "In Progress", "Resolved"].map(s =>
                            '<option value="' + s + '"' + (s === c.status ? " selected" : "") + '>' + s + '</option>').join("");

                        return '<tr>' +
                            '<td class="id">' + esc(compId) + '</td>' +
                            '<td>' + esc(c.title) + '</td>' +
                            '<td>' + esc(c.category) + '</td>' +
                            '<td>' + esc(c.description) + '</td>' +
                            '<td><span class="chip ' + esc(String(c.status).replace(/\s+/g, "-")) + '">' + esc(c.status) + '</span></td>' +
                            '<td><select data-id="' + esc(compId) + '" class="staff-status-select">' + statusOpts + '</select></td>' +
                            '</tr>';
                    }).join("");
                })
                .catch(() => toast("Could not load assigned complaints."));
        }

        document.getElementById("staffTableBody").addEventListener("change", function (e) {
            if (!e.target.classList.contains("staff-status-select")) return;
            const data = new URLSearchParams();
            data.append("complaintId", e.target.dataset.id);
            data.append("status", e.target.value);

            fetch("/api/update-staff-complaint", { method: "POST", body: data })
                .then(res => {
                    if (res.ok) {
                        toast("Status updated successfully!");
                        loadStaffComplaints();
                    } else {
                        toast("Failed to update status.");
                    }
                })
                .catch(() => toast("Network error."));
        });

        loadStaffComplaints();

        // Theme toggle
        (function () {
            const root = document.documentElement, btn = document.getElementById("themeToggle");
            function paint() { btn.textContent = root.getAttribute("data-theme") === "dark" ? "Light mode" : "Dark mode"; }
            btn.addEventListener("click", function () {
                const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("cms-theme", next); } catch (e) { }
                paint();
            });
            paint();
        })();
    </script>
</body>

</html>
